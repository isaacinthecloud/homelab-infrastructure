# Traefik static configuration (mounted read-only at /traefik.yml).
api:
  dashboard: true
  insecure: false

log:
  level: INFO
  filePath: /var/log/traefik/traefik.log

accessLog:
  filePath: /var/log/traefik/access.log

entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true
  websecure:
    address: ":443"

providers:
  docker:
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false
    network: traefik-net
  file:
    directory: /dynamic
    watch: true

certificatesResolvers:
  letsencrypt:
    acme:
      email: admin@example.com
      storage: /acme/acme.json
      dnsChallenge:
        provider: route53
        propagation:
          # Internal resolvers can't see the public TXT record, so skip the
          # local propagation check and just wait before asking Let's Encrypt.
          delayBeforeChecks: 60s
          disableChecks: true
        resolvers:
          - "1.1.1.1:53"
          - "8.8.8.8:53"
