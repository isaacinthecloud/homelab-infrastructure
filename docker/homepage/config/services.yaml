---
# Every {{HOMEPAGE_VAR_*}} comes from /root/docker/homepage.env (mode 600, not in repo).
# Widgets talk to Docker services by container name on traefik-net (the VPN'd apps
# live in gluetun's network namespace, so they're reached as gluetun:<port>).
# Hosts outside CT 103 are reached through their Traefik names, so no LAN IPs here.

- Infrastructure:
    - Proxmox:
        icon: proxmox.svg
        href: https://proxmox.lab.{{HOMEPAGE_VAR_DOMAIN}}
        description: pve · hypervisor
        siteMonitor: https://proxmox.lab.{{HOMEPAGE_VAR_DOMAIN}}
        widget:
          type: proxmox
          url: https://proxmox.lab.{{HOMEPAGE_VAR_DOMAIN}}
          username: "{{HOMEPAGE_VAR_PROXMOX_TOKEN_ID}}"
          password: "{{HOMEPAGE_VAR_PROXMOX_TOKEN_SECRET}}"
          node: pve

    - TrueNAS:
        icon: truenas-scale.svg
        href: https://truenas.lab.{{HOMEPAGE_VAR_DOMAIN}}
        description: datastore · 3x 14 TB RAIDZ1
        siteMonitor: https://truenas.lab.{{HOMEPAGE_VAR_DOMAIN}}
        widget:
          type: truenas
          url: https://truenas.lab.{{HOMEPAGE_VAR_DOMAIN}}
          key: "{{HOMEPAGE_VAR_TRUENAS_KEY}}"
          version: 2            # websocket API (25.04 returns 403 on REST for API keys)
          enablePools: true

    - Portainer:
        icon: portainer.svg
        href: https://portainer.lab.{{HOMEPAGE_VAR_DOMAIN}}
        description: Container management
        server: docker
        container: portainer
        widget:
          type: portainer
          url: http://portainer:9000
          env: 3                # Portainer environment id of "local" (GET /api/endpoints)
          key: "{{HOMEPAGE_VAR_PORTAINER_KEY}}"

    - Traefik:
        icon: traefik.svg
        href: https://traefik.lab.{{HOMEPAGE_VAR_DOMAIN}}
        description: Reverse proxy · *.lab certs
        server: docker
        container: traefik
        widget:
          type: traefik
          url: https://traefik.lab.{{HOMEPAGE_VAR_DOMAIN}}
          username: "{{HOMEPAGE_VAR_TRAEFIK_USER}}"
          password: "{{HOMEPAGE_VAR_TRAEFIK_PASSWORD}}"

- Network:
    - UniFi:
        icon: unifi.svg
        href: "{{HOMEPAGE_VAR_UNIFI_URL}}"
        description: Cloud Gateway Max
        widget:
          type: unifi
          url: "{{HOMEPAGE_VAR_UNIFI_URL}}"
          key: "{{HOMEPAGE_VAR_UNIFI_KEY}}"
          fields: ["wan", "lan_users", "wlan_users", "uptime"]

    - AdGuard Home:
        icon: adguard-home.svg
        href: https://adguard.lab.{{HOMEPAGE_VAR_DOMAIN}}
        description: DNS filtering
        siteMonitor: https://adguard.lab.{{HOMEPAGE_VAR_DOMAIN}}
        widget:
          type: adguard
          url: https://adguard.lab.{{HOMEPAGE_VAR_DOMAIN}}
          username: "{{HOMEPAGE_VAR_ADGUARD_USER}}"
          password: "{{HOMEPAGE_VAR_ADGUARD_PASSWORD}}"

    - Tailscale:
        icon: tailscale.svg
        href: https://login.tailscale.com/admin/machines
        description: Subnet router · remote access
        widget:
          type: tailscale
          deviceid: "{{HOMEPAGE_VAR_TAILSCALE_DEVICE_ID}}"
          key: "{{HOMEPAGE_VAR_TAILSCALE_KEY}}"   # API tokens expire (max 90 days)

    - Gluetun:
        icon: gluetun.svg
        description: NordVPN tunnel for the download stack
        server: docker
        container: gluetun
        widget:
          type: gluetun
          url: http://gluetun:8000
          key: "{{HOMEPAGE_VAR_GLUETUN_KEY}}"   # role "homepage" in gluetun/auth/config.toml: GET /v1/publicip/ip only
          version: 2
          fields: ["public_ip", "region", "country"]

- Media:
    - Jellyfin:
        icon: jellyfin.svg
        href: https://media.{{HOMEPAGE_VAR_DOMAIN}}
        description: Movies & shows
        server: docker
        container: jellyfin
        widget:
          type: jellyfin
          url: http://jellyfin:8096
          key: "{{HOMEPAGE_VAR_JELLYFIN_KEY}}"
          version: 2
          enableBlocks: true
          enableNowPlaying: true

    - Seerr:
        icon: seerr.svg
        href: https://seerr.lab.{{HOMEPAGE_VAR_DOMAIN}}
        description: Requests
        server: docker
        container: seerr
        widget:
          type: seerr
          url: http://seerr:5055
          key: "{{HOMEPAGE_VAR_SEERR_KEY}}"

    - Immich:
        icon: immich.svg
        href: https://photos.lab.{{HOMEPAGE_VAR_DOMAIN}}
        description: Photos
        server: docker
        container: immich_server
        widget:
          type: immich
          url: http://immich_server:2283
          key: "{{HOMEPAGE_VAR_IMMICH_KEY}}"
          version: 2

    - Trailarr:
        icon: trailarr.png
        href: https://trailarr.lab.{{HOMEPAGE_VAR_DOMAIN}}
        description: Local trailers
        server: docker
        container: trailarr

- Downloads:
    - Sonarr:
        icon: sonarr.svg
        href: https://sonarr.lab.{{HOMEPAGE_VAR_DOMAIN}}
        description: Shows
        server: docker
        container: sonarr
        widget:
          type: sonarr
          url: http://gluetun:8989
          key: "{{HOMEPAGE_VAR_SONARR_KEY}}"

    - Radarr:
        icon: radarr.svg
        href: https://radarr.lab.{{HOMEPAGE_VAR_DOMAIN}}
        description: Movies
        server: docker
        container: radarr
        widget:
          type: radarr
          url: http://gluetun:7878
          key: "{{HOMEPAGE_VAR_RADARR_KEY}}"

    - Lidarr:
        icon: lidarr.svg
        href: https://lidarr.lab.{{HOMEPAGE_VAR_DOMAIN}}
        description: Music
        server: docker
        container: lidarr
        widget:
          type: lidarr
          url: http://gluetun:8686
          key: "{{HOMEPAGE_VAR_LIDARR_KEY}}"

    - Prowlarr:
        icon: prowlarr.svg
        href: https://prowlarr.lab.{{HOMEPAGE_VAR_DOMAIN}}
        description: Indexers
        server: docker
        container: prowlarr
        widget:
          type: prowlarr
          url: http://gluetun:9696
          key: "{{HOMEPAGE_VAR_PROWLARR_KEY}}"

    - Bazarr:
        icon: bazarr.svg
        href: https://bazarr.lab.{{HOMEPAGE_VAR_DOMAIN}}
        description: Subtitles
        server: docker
        container: bazarr
        widget:
          type: bazarr
          url: http://gluetun:6767
          key: "{{HOMEPAGE_VAR_BAZARR_KEY}}"

    - qBittorrent:
        icon: qbittorrent.svg
        href: https://qbt.lab.{{HOMEPAGE_VAR_DOMAIN}}
        description: Torrents (via VPN)
        server: docker
        container: qbittorrent
        widget:
          type: qbittorrent
          url: http://gluetun:8080
          key: "{{HOMEPAGE_VAR_QBITTORRENT_KEY}}"   # Options > WebUI > Authentication > API key (qBt 5.2+)

- Home:
    - Home Assistant:
        icon: home-assistant.svg
        href: https://ha.lab.{{HOMEPAGE_VAR_DOMAIN}}
        description: HAOS VM
        siteMonitor: https://ha.lab.{{HOMEPAGE_VAR_DOMAIN}}
        widget:
          type: homeassistant
          url: https://ha.lab.{{HOMEPAGE_VAR_DOMAIN}}
          key: "{{HOMEPAGE_VAR_HA_TOKEN}}"

    - Syncthing:
        icon: syncthing.svg
        href: https://syncthing.lab.{{HOMEPAGE_VAR_DOMAIN}}
        description: Obsidian vault sync
        server: docker
        container: syncthing
        widget:
          type: syncthing
          url: http://syncthing:8384
          key: "{{HOMEPAGE_VAR_SYNCTHING_KEY}}"
